<div class="team-grid">
  {% for employee in collections.employees %}
  <figure class="team-card">
    <a href="{{ employee.url }}" title="Läs mer om: {{ employee.data.name | escape }}">
      <img src="{{ employee.data.thumb }}" alt="{{ employee.data.name | escape }}">
    </a>
    <figcaption>{{ employee.data.name }}</figcaption>
  </figure>
  {% endfor %}
</div>
