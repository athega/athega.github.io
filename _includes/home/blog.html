<div class="home-latest">
  <div class="home-latest-heading">
    <p class="eyebrow">{{ home.content.blog.heading | escape }}</p>
    <a class="text-link" href="/blogg/">{{ home.content.blog.linkLabel | escape }} <span>↗</span></a>
  </div>
  <div class="home-latest-grid">
    {% for post in collections.posts limit:3 %}
      <a class="home-latest-card" href="{{ post.url }}">
        {% if post.data.image_url %}
          <img src="{{ post.data.image_url }}" alt="">
        {% endif %}
        <div>
          <h2>{{ post.data.title }}</h2>
          <p>{{ post.data.description }}</p>
        </div>
      </a>
    {% endfor %}
  </div>
</div>
