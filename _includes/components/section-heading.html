<div class="section-heading{% if variant == 'stacked' %} stacked-section-heading{% endif %}">
  {% if heading.eyebrow %}<p class="eyebrow">{{ heading.eyebrow | escape }}</p>{% endif %}
  {% if heading.heading %}<h2>{{ heading.heading | escape }}</h2>{% endif %}
  {% if heading.intro %}<p class="heading-note">{{ heading.intro | escape }}</p>{% endif %}
</div>
