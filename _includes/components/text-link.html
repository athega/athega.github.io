<a class="text-link{% if variant == 'dark' %} light{% endif %}" href="{% if link.email %}mailto:{{ link.email | escape }}{% if link.subject %}?subject={{ link.subject | url_encode | replace: '+', '%20' | escape }}{% endif %}{% else %}{{ link.href | escape }}{% endif %}">{% if link.email %}{% if link.label != blank %}{{ link.label | escape }}{{ link.email_separator | default: ' – ' | escape }}{% endif %}{{ link.email | escape }}{% else %}{{ link.label | escape }}{% endif %} <span>↗</span></a>
