<section class="section{% if variant == 'soft' %} soft-section{% elsif variant == 'facts' %} facts-section{% elsif kind == 'values' %} work-values{% elsif kind == 'community' %} soft-section work-community{% endif %}"{% if id != empty %} id="{{ id | escape }}"{% endif %}>
  <div class="shell">
    {% include "sections/heading.html", eyebrow: eyebrow, heading: heading, intro: intro, kind: kind, variant: variant %}
    <div class="card-list{% if kind == 'steps' %} numbered{% endif %}">
      {% for card in cards %}
        <article class="card">
          {% if kind == 'steps' %}<span>{% if forloop.index < 10 %}0{% endif %}{{ forloop.index }}</span>{% endif %}
          {{ card.heading }}
          {{ card.body }}
        </article>
      {% endfor %}
    </div>
  </div>
</section>
